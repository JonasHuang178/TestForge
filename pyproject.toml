[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "testforge"
version = "0.1.0"
description = "Generate C++ test code from markdown test plans"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "markdown-it-py>=3.0",
    "Jinja2>=3.1",          # HTML templates for the web page
    "PyYAML>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "click>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
testforge = "testforge.cli:_run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Devices are not shipped with the package: they live in the project's own
# ./devices directory, or wherever TESTFORGE_DEVICE_PATH points.
"testforge.web" = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
