# TestForge device manifest — reference example.
#
# Copy this directory to add a device of your own. No Python changes are
# needed: the loader reads this file, validates it at startup, and the
# templates below are the whole code-generation definition.
#
# Template context available in every template and fragment:
#
#   device   {id, name}
#   case     {index, title, id, pascal, snake, metadata, description_md,
#             step_count, source_line}
#   steps    [{index, declared_index, title, function_name, description_md,
#              expected, has_expected, source_line, is_first, is_last}]
#   output   {path, basename, stem, extension, guard}   <- the file being built
#   outputs  [ ...same shape, for every file of this case ]
#
# Filters: cpp_comment, cpp_string, first_line, indent_block,
#          pascal, snake, camel, upper_snake, cpp_ident

id: example_device
name: Example Device
description: >-
  Reference device showing the full mechanism: a header and a source file,
  three anchors, and index-prefixed step function names. support/ carries a
  minimal runtime header so the generated code can be compiled as-is.
version: 1

# How this device's test plans are written. Override per device if your team
# already uses a different heading layout.
parse:
  case_heading_level: 1
  step_heading_level: 2

naming:
  # Placeholders: index, declared_index, pascal_title, snake_title,
  # camel_title, upper_title, case_index, case_pascal, case_snake, case_id,
  # device_id. Keeping {index} first makes names stable across retitling.
  step_function: "TestStep_{index:02d}_{pascal_title}"

# Everything between a BEGIN and its END is rewritten on every generation;
# anything outside is yours and is never touched.
anchor:
  begin: "// === TESTFORGE:{name}:BEGIN ==="
  end: "// === TESTFORGE:{name}:END ==="

outputs:
  - path: "test_{case_snake}.h"
    template: test_case.h.j2
    fragments:
      STEP_DECLS: step_decls.cpp.j2

  - path: "test_{case_snake}.cpp"
    template: test_case.cpp.j2
    fragments:
      STEP_CALLS: step_calls.cpp.j2
      STEP_DEFS: step_defs.cpp.j2
