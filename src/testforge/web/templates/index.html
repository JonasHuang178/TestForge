<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TestForge</title>
<link rel="stylesheet" href="/static/app.css">
<link rel="icon" href="data:,">
</head>
<body>

<header class="bar">
  <div class="brand">
    <strong>TestForge</strong>
    <span class="muted">從 markdown 測試計畫產生 C++ 測試程式碼</span>
  </div>

  <ol class="stepper" id="stepper">
    <li data-step="1" class="current"><span class="n">1</span>輸入計畫</li>
    <li data-step="2"><span class="n">2</span>確認結果</li>
    <li data-step="3"><span class="n">3</span>下載</li>
  </ol>
</header>

<!-- ───────────────────────── step 1 ───────────────────────── -->
<section class="step" id="step-1">

  <div class="step-bar">
    <label>
      Device
      <select id="device" name="device_id">
        {% for d in devices %}
        <option value="{{ d.id }}" data-steps="{{ d.steps }}"
                data-style="{{ d.step_style }}"
                data-rules="{{ d.rules }}">{{ d.name }}</option>
        {% endfor %}
      </select>
    </label>
    <button type="button" id="toggle-advanced" class="ghost">進階</button>
    <p class="hint muted" id="device-hint"></p>
  </div>

  <div id="advanced" class="advanced" hidden>
    <label>
      步驟標題層級
      <select id="step-level">
        <option value="">依 device 設定</option>
        <option value="2">## （H2）</option>
        <option value="3">### （H3）</option>
        <option value="4">#### （H4）</option>
      </select>
    </label>
    <p class="hint muted">只有在 device 以標題辨識步驟時有作用。</p>
  </div>

  <div class="panes">
    <section class="pane">
      <div class="pane-head">
        <h2>測試計畫</h2>
        <div class="pane-actions">
          <button type="button" id="load-example" class="ghost">載入範例</button>
          <label class="ghost filelabel">
            開啟檔案<input type="file" id="file" accept=".md,.markdown,.txt" hidden>
          </label>
          <button type="button" id="clear" class="ghost">清除</button>
        </div>
      </div>
      <textarea id="source" spellcheck="false"
                placeholder="貼上 markdown 測試計畫，或按「開啟檔案」選一份。右側會即時顯示解析結果。"></textarea>
      <p class="statusline muted" id="editor-status">&nbsp;</p>
    </section>

    <section class="pane">
      <div class="pane-head">
        <h2>解析結果</h2>
        <span class="muted" id="preview-status"></span>
      </div>
      <div id="preview" class="scroll">
        <p class="empty">貼上計畫後，這裡會顯示偵測到的 test case 與步驟。</p>
      </div>
    </section>
  </div>

  <footer class="step-actions">
    <span class="muted" id="step1-note"></span>
    <button type="button" id="to-step-2" class="primary" disabled>產生程式碼 →</button>
  </footer>
</section>

<!-- ───────────────────────── step 2 ───────────────────────── -->
<section class="step" id="step-2" hidden>
  <div class="step-intro">
    <h2>確認產生結果</h2>
    <p class="muted">
      anchor 標記之間的內容每次都會重寫，標記之外的手寫程式碼會保留。
    </p>
  </div>

  <div id="artifacts" class="scroll-tall"></div>

  <footer class="step-actions">
    <button type="button" id="back-to-1" class="ghost">← 上一步</button>
    <button type="button" id="to-step-3" class="primary">確認，前往下載 →</button>
  </footer>
</section>

<!-- ───────────────────────── step 3 ───────────────────────── -->
<section class="step" id="step-3" hidden>
  <div class="step-intro">
    <h2>下載</h2>
    <p class="muted" id="download-summary"></p>
  </div>

  <ul class="file-list" id="file-list"></ul>

  <div class="download-actions">
    <button type="button" class="primary" data-download="zip">下載 zip</button>
  </div>

  <footer class="step-actions">
    <button type="button" id="back-to-2" class="ghost">← 上一步</button>
    <button type="button" id="restart" class="ghost">重新開始</button>
  </footer>
</section>

<form id="download-form" method="post" action="/download" hidden>
  <input type="hidden" name="source">
  <input type="hidden" name="device_id">
  <input type="hidden" name="case_selector">
  <input type="hidden" name="step_level">
  <input type="hidden" name="what">
  <input type="hidden" name="path">
</form>

{% for d in devices %}
<template class="example-plan" data-device="{{ d.id }}">{{ d.example }}</template>
{% endfor %}

<script src="/static/app.js"></script>
</body>
</html>
